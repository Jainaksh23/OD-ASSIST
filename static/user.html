<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OD Assist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/user.css" />
</head>

<body>


  <!-- Chat App -->
  <div id="chat-app" class="screen">
    <header class="chat-header">
      <div class="header-left">
        <div class="avatar">⚡</div>
        <div class="header-info">
          <h1>OD Assist</h1>
          <p class="tagline">Okie Dokie knowledge assistant</p>
        </div>
      </div>
      <div class="header-actions">
        <span class="badge"><span class="badge-dot"></span>Online</span>
        <a href="/admin" class="icon-btn" aria-label="Switch to Admin" title="Switch to Admin" style="text-decoration: none;">⚙️</a>
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">🌙</button>
      </div>
    </header>

    <div class="mode-toggle">
      <button id="toggle-chat-btn" class="toggle-btn active">💬 Chat</button>
      <button id="toggle-faq-btn" class="toggle-btn">❓ FAQ</button>
    </div>

    <!-- FAQ View -->
    <main id="faq-view" class="hidden" style="flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem;">
      <div class="faq-controls" style="display: flex; flex-direction: column; gap: 1rem;">
        <input type="text" id="faq-search-input" placeholder="Search FAQs..." style="width: 100%; padding: 0.75rem 1rem; border-radius: 20px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-main);" />
        <div id="faq-category-filters" style="display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem;">
          <button class="faq-cat-btn active" data-cat="all">All</button>
          <button class="faq-cat-btn" data-cat="General">General</button>
          <button class="faq-cat-btn" data-cat="Fees">Fees</button>
          <button class="faq-cat-btn" data-cat="Transport">Transport</button>
          <button class="faq-cat-btn" data-cat="Admissions">Admissions</button>
          <button class="faq-cat-btn" data-cat="Payroll">Payroll</button>
        </div>
      </div>
      <div id="faq-loading" class="placeholder-state" style="text-align: center; padding: 2rem;">Loading FAQs...</div>
      <div id="faq-empty" class="placeholder-state hidden" style="text-align: center; padding: 2rem;">No FAQs found.</div>
      <div id="faq-accordion" class="faq-accordion hidden" style="display: flex; flex-direction: column; gap: 0.75rem;">
        <!-- Injected via JS -->
      </div>
    </main>

    <main id="messages">
      <!-- Empty state, shown until first message is sent -->
      <div id="empty-state" class="empty-state">
        <div class="bg-blob"></div>
        <div class="empty-avatar">⚡</div>
        <h2>What would you like to know?</h2>
        <p>Ask anything about fees, admissions, transport, or payroll — I'll find the answer from Okie Dokie's documents.</p>
        <div class="suggestion-grid" id="suggestion-grid">
          <button class="suggestion-chip" data-q="How does fee collection work?" style="animation-delay: 0ms;">
            <span class="chip-icon">💰</span> How does fee collection work?
          </button>
          <button class="suggestion-chip" data-q="New student admission process" style="animation-delay: 50ms;">
            <span class="chip-icon">🎓</span> New student admission process
          </button>
          <button class="suggestion-chip" data-q="Transport module setup" style="animation-delay: 100ms;">
            <span class="chip-icon">🚌</span> Transport module setup
          </button>
          <button class="suggestion-chip" data-q="How is payroll processed?" style="animation-delay: 150ms;">
            <span class="chip-icon">🧾</span> How is payroll processed?
          </button>
          <button class="suggestion-chip" data-q="GPS configuration" style="animation-delay: 200ms;">
            <span class="chip-icon">📍</span> GPS configuration
          </button>
          <button class="suggestion-chip" data-q="Student promotion process" style="animation-delay: 250ms;">
            <span class="chip-icon">📈</span> Student promotion process
          </button>
        </div>
        <div id="rotating-tips" class="rotating-tips"></div>
      </div>
    </main>

    <button id="scroll-bottom-btn" class="circle-btn scroll-bottom hidden" aria-label="Scroll to bottom">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
    </button>
    <footer class="input-bar">
      <form id="chat-form">
        <textarea id="query-input" rows="1" placeholder="Ask a question..." required
          autocomplete="off"></textarea>
        <button type="submit" id="send-btn" class="circle-btn" aria-label="Send message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </form>
      <p class="input-hint">Enter to send · Shift+Enter for new line</p>
    </footer>
  </div>

  <script src="/static/user.js?v=2"></script>
</body>

</html>
