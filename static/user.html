<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OD Assist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/static/user.css" />
</head>

<body>

  <!-- Login Screen -->
  <div id="login-screen" class="screen">
    <div class="login-bg-shape"></div>
    <div class="login-card">
      <div class="login-logo"><span class="logo-mark">⚡</span> OD Assist</div>
      <p class="login-sub">Your Okie Dokie knowledge assistant</p>
      <form id="login-form">
        <div class="field-group">
          <label>Username</label>
          <input id="username" type="text" placeholder="oduser" required autocomplete="username" />
        </div>
        <div class="field-group">
          <label>Password</label>
          <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-primary">
          <span>Sign In</span>
        </button>
      </form>
      <p id="login-error" class="error-msg hidden"></p>
    </div>
  </div>

  <!-- Chat App -->
  <div id="chat-app" class="screen hidden">
    <header class="chat-header">
      <div class="header-left">
        <div class="avatar">⚡</div>
        <div class="header-info">
          <h1>OD Assist</h1>
          <p class="tagline">Okie Dokie knowledge assistant</p>
        </div>
      </div>
      <div class="header-actions">
        <span class="badge"><span class="badge-dot"></span>Online</span>
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">🌙</button>
        <button id="logout-btn" class="icon-btn" aria-label="Sign out">⏻</button>
      </div>
    </header>

    <main id="messages">
      <!-- Empty state, shown until first message is sent -->
      <div id="empty-state" class="empty-state">
        <div class="empty-avatar">⚡</div>
        <h2>Kya jaanna chahte hain?</h2>
        <p>Fee, admission, transport, payroll — kuch bhi poochho, main Okie Dokie ke documents se jawab dhoondh dunga.
        </p>
        <div class="suggestion-grid" id="suggestion-grid">
          <button class="suggestion-chip" data-q="Fee collection process kya hai?">
            <span class="chip-icon">💰</span> Fee collection kaise karein?
          </button>
          <button class="suggestion-chip" data-q="Naya student admission kaise karte hain?">
            <span class="chip-icon">🎓</span> Naya student admission
          </button>
          <button class="suggestion-chip" data-q="Transport module setup kaise karein?">
            <span class="chip-icon">🚌</span> Transport setup
          </button>
          <button class="suggestion-chip" data-q="Payroll process kaise chalta hai?">
            <span class="chip-icon">🧾</span> Payroll kaise chalayein?
          </button>
          <button class="suggestion-chip" data-q="GPS config kaise set karein?">
            <span class="chip-icon">📍</span> GPS config
          </button>
          <button class="suggestion-chip" data-q="Student promote kaise karte hain agle session mein?">
            <span class="chip-icon">📈</span> Student promote
          </button>
        </div>
      </div>
    </main>

    <footer class="input-bar">
      <form id="chat-form">
        <textarea id="query-input" rows="1" placeholder="Ask a question about OD knowledge…" required
          autocomplete="off"></textarea>
        <button type="submit" id="send-btn" class="circle-btn" aria-label="Send message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </form>
      <p class="input-hint">Enter to send · Shift+Enter for new line</p>
    </footer>
  </div>

  <script src="/static/user.js"></script>
</body>

</html>
